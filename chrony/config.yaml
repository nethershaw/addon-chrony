---
name: chrony
version: dev
slug: chrony
description: A local NTP (Network Time Protocol) server for cameras etc.
url: https://github.com/hassio-addons/addon-chrony
codenotary: codenotary@frenck.dev
startup: system
arch:
  - aarch64
  - amd64
  - armv7
hassio_api: true
init: false
privileged:
  - SYS_TIME
ports:
  123/udp: 123
ports_description:
  123/udp: NTP; Network Time Protocol
options:
  set_system_clock: true
  ntp_pool: time.example.com
  ntp_server:
    - 198.51.100.123
    - 0.time.example.org
  ntp_peer:
    - 192.0.2.123
    - local.ntp-server.test
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  set_system_clock: bool
  ntp_pool: str?
  ntp_server:
    - str?
  ntp_peer:
    - str?
